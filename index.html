<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charm Card · Parametric Packaging</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="split">
  <aside class="panel" aria-label="Design parameters">
    <header class="brand">
      <div class="logo" aria-hidden="true">▤</div>
      <div>
        <h1>Charm Card</h1>
        <p>Parametric 3D-printed packaging</p>
      </div>
    </header>
    <div id="panel-sections"></div>
    <footer class="panel-foot">Settings auto-save in this browser. Units: mm.</footer>
  </aside>

  <main class="stage">
    <div class="toolbar" role="toolbar" aria-label="View">
      <div class="seg-buttons">
        <button data-setview="3d" aria-pressed="false">3D print preview</button>
        <button data-setview="split" aria-pressed="true">Split</button>
        <button data-setview="2d" aria-pressed="false">2D layout</button>
      </div>
      <div class="cam-buttons">
        <span class="muted">Camera</span>
        <button data-cam="persp">Angle</button>
        <button data-cam="top">Top</button>
        <button data-cam="close">Close-up</button>
        <button data-cam="back" title="View the back of the card">Back</button>
        <button id="fit2d" title="Fit 2D view">Fit 2D</button>
      </div>
    </div>
    <div class="views">
      <section class="view view-3d" aria-label="3D print preview">
        <div id="view3d" class="canvas-host"></div>
        <div class="layer-bar">
          <label for="layer-slider">Layer preview</label>
          <input type="range" id="layer-slider" min="1" max="10" value="10" step="1">
          <span id="layer-label" class="muted"></span>
        </div>
      </section>
      <section class="view view-2d" aria-label="2D layout">
        <div id="view2d" class="canvas-host"></div>
        <div class="legend">
          <span><i class="lg lost"></i>won't print</span>
          <span><i class="lg gained"></i>widened by slicer</span>
          <span><i class="lg hole"></i>cut through</span>
          <span class="muted">Drag wordmark / charm · scroll to zoom · drag to pan</span>
        </div>
      </section>
      <aside id="info" class="info" aria-live="polite"></aside>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/RoomEnvironment.js"></script>
  <script src="vendor/clipper.js"></script>
  <script src="vendor/opentype.min.js"></script>
  <script src="assets/defaults.js"></script>
  <script src="assets/fonts.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/dxf.js"></script>
  <script src="js/svgpath.js"></script>
  <script src="js/design.js"></script>
  <script src="js/model.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/view2d.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>PP.app.init();</script>
</body>
</html>
