<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charm Card · Laser-Cut Chipboard Packaging</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="2d">
  <aside class="panel" aria-label="Design parameters">
    <header class="brand">
      <div class="logo" aria-hidden="true">▤</div>
      <div>
        <h1>Charm Card</h1>
        <p>Parametric laser-cut chipboard packaging</p>
      </div>
    </header>
    <div id="panel-sections"></div>
    <footer class="panel-foot">
      <div class="foot-actions">
        <button type="button" id="foot-laser-front" class="primary" title="Download Front Laser SVG (markings + charm inset)">Front SVG</button>
        <button type="button" id="foot-laser-back" class="primary" title="Download Back Laser SVG (outline + finger hole)">Back SVG</button>
        <button type="button" id="foot-save-preset" title="Save current setup to local presets">Save preset</button>
        <button type="button" id="foot-save-json" title="Download settings (.json)">Save settings</button>
      </div>
      <div class="foot-note">Settings auto-save in this browser. Units: mm.</div>
    </footer>
  </aside>

  <main class="stage">
    <div class="toolbar" role="toolbar" aria-label="Preview mode">
      <div class="seg-buttons">
        <button data-laserview="chipboard" aria-pressed="true">2mm Chipboard</button>
        <button data-laserview="front" aria-pressed="false">Front SVG</button>
        <button data-laserview="back" aria-pressed="false">Back SVG</button>
      </div>
      <div class="cam-buttons">
        <button id="toggle-charm" aria-pressed="true" title="Show or hide brass charm in pocket">Show charm</button>
        <button id="fit2d" title="Fit card to view">Fit</button>
      </div>
    </div>
    <div class="views">
      <section class="view view-2d" aria-label="Laser layout preview">
        <div id="view2d" class="canvas-host"></div>
        <div class="legend" id="view-legend">
          <span><i class="lg chip-cut"></i>2mm cutout (back layer)</span>
          <span><i class="lg score-line"></i>scored / engraved</span>
          <span class="muted">Drag wordmark / charm · scroll to zoom · drag to pan</span>
        </div>
      </section>
      <aside id="info" class="info" aria-live="polite"></aside>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/clipper.js"></script>
  <script src="vendor/opentype.min.js"></script>
  <script src="assets/defaults.js"></script>
  <script src="assets/fonts.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/dxf.js"></script>
  <script src="js/svgpath.js"></script>
  <script src="js/design.js"></script>
  <script src="js/view2d.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>PP.app.init();</script>
</body>
</html>
